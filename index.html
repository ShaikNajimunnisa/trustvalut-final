<!DOCTYPE html>
<html>
<head>
  <title>TrustVault Login</title>
</head>
<body>
  <h2>TrustVault Login</h2>
  <input id="email" placeholder="email" value="owner@vault.com" />
  <input id="pass" type="password" placeholder="password" value="owner123" />
  <button onclick="login()">Login</button>
  <hr />
  <input type="file" id="file" />
  <button onclick="upload()">Upload File</button>
  <button onclick="loadDocs()">Load My Documents</button>
  <pre id="out"></pre>

  <script>
    let token = '';
    async function login() {
      const email = document.getElementById('email').value;
      const pass = document.getElementById('pass').value;
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password: pass }),
      });
      const data = await res.json();
      token = data.token || '';
      document.getElementById('out').textContent = JSON.stringify(data, null, 2);
    }

    async function upload() {
      if (!token) {
        alert('Login first');
        return;
      }
      const fileInput = document.getElementById('file');
      if (fileInput.files.length === 0) {
        alert('Choose a file');
        return;
      }
      const formData = new FormData();
      formData.append('file', fileInput.files[0]);

      const res = await fetch('/api/documents/upload', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token },
        body: formData,
      });
      const data = await res.json();
      document.getElementById('out').textContent = JSON.stringify(data, null, 2);
    }

    async function loadDocs() {
      if (!token) {
        alert('Login first');
        return;
      }
      const res = await fetch('/api/documents', {
        headers: { Authorization: 'Bearer ' + token },
      });
      const docs = await res.json();
      document.getElementById('out').textContent = JSON.stringify(docs, null, 2);
    }
  </script>
</body>
</html>
